spring.application.name=smart-fence-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_fence_iot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jpa.open-in-view=false

mqtt.enabled=${MQTT_ENABLED:false}
# Set MQTT_ENABLED=true and provide the broker address when integrating ESP32.
mqtt.host=${MQTT_HOST:}
mqtt.port=${MQTT_PORT:1883}
mqtt.username=${MQTT_USERNAME:}
mqtt.password=${MQTT_PASSWORD:}
mqtt.client-id=${MQTT_CLIENT_ID:smart-fence-backend}

# For ESP32 integration, set MQTT_ENABLED=true and MQTT_HOST to the broker address
# reachable from this backend process. Supply MQTT_USERNAME/MQTT_PASSWORD only when
# broker authentication is enabled; never commit real credentials.
